[project]
name = "focus-catcher-inference"
version = "0.1.0"
description = "Local-first inference service for the AI Focus Catcher prototype."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "pydantic>=2.11.0,<3.0.0",
  "reportlab>=4.4.0,<5.0.0",
  "uvicorn>=0.35.0,<1.0.0"
]

[project.scripts]
focus-buddy-benchmark = "focus_catcher.benchmark:main"

[dependency-groups]
dev = [
  "httpx>=0.28.0,<1.0.0",
  "pytest>=8.4.0,<9.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/focus_catcher"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
